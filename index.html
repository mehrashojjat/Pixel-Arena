<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Pixel Arena</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#10131b;color:#f3f5fa;font-family:system-ui,Arial;overflow:hidden}#arena{display:block;width:100vw;height:100vh}#hud{position:fixed;left:14px;top:12px;z-index:2;font-size:13px;pointer-events:none}#hud strong{font-size:17px}#qrbox{position:fixed;right:15px;top:15px;background:#fff;padding:9px;border-radius:8px;z-index:3;color:#222;text-align:center}#qr{width:140px;height:140px}#qr img,#qr canvas{width:140px!important;height:140px!important}#joinurl{font-size:10px;max-width:150px;overflow-wrap:anywhere;margin-top:5px}#controller{display:none;position:fixed;inset:0;background:#10131b;flex-direction:column;align-items:center;justify-content:space-between;padding:24px 12px 35px;touch-action:none}#status{font-weight:700;text-align:center}#sticks{width:100%;display:flex;justify-content:space-around;align-items:center;gap:12px;flex:1} .stick-wrap{display:flex;flex-direction:column;align-items:center;gap:16px;min-width:0}.stick{width:min(39vw,190px);height:min(39vw,190px);border-radius:50%;border:3px solid var(--player,#777);background:#242b37;position:relative;touch-action:none;user-select:none}.nub{position:absolute;width:35%;height:35%;border-radius:50%;background:var(--player,#777);left:32.5%;top:32.5%;pointer-events:none}.label{font-size:14px;font-weight:700;letter-spacing:1px}#note{font-size:12px;color:#aeb8c9;text-align:center}#dead{display:none;color:#ff8a8a}#error{position:fixed;left:15px;bottom:15px;color:#ff9d9d;font-size:12px;max-width:65vw}
</style></head><body><canvas id="arena"></canvas><div id="hud"><strong>PIXEL ARENA</strong><div id="count">0 players connected</div><div id="hint">Scan QR with phones to join</div></div><div id="qrbox"><div id="qr"></div><div id="joinurl"></div></div><div id="error"></div>
<div id="controller"><div id="status">Connecting…</div><div id="sticks"><div class="stick-wrap"><div class="stick" id="move"><div class="nub"></div></div><div class="label">MOVE</div></div><div class="stick-wrap"><div class="stick" id="aim"><div class="nub"></div></div><div class="label">SHOOT</div></div></div><div id="dead">ELIMINATED — waiting to respawn</div><div id="note">Hold SHOOT toward a direction to fire. Release to stop.</div></div>
<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.5/dist/peerjs.min.js"></script><script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
<script>
(()=>{'use strict';
const params=new URLSearchParams(location.search), hostId=params.get('join');
const canvas=document.getElementById('arena'),ctx=canvas.getContext('2d');let W=0,H=0;
function resize(){W=canvas.width=innerWidth*devicePixelRatio;H=canvas.height=innerHeight*devicePixelRatio;ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);W=innerWidth;H=innerHeight}addEventListener('resize',resize);resize();
const error=s=>document.getElementById('error').textContent=s;
if(typeof Peer==='undefined'){error('PeerJS could not load. Check your internet connection.');return}
const peer=new Peer();let players=new Map(),bullets=[],nextNum=0,last=performance.now();
function color(i){const hue=(i*137.50776405)%360;return `hsl(${hue.toFixed(2)} 95% 65%)`}
function spawn(p){p.x=80+Math.random()*Math.max(1,W-160);p.y=80+Math.random()*Math.max(1,H-160);p.hp=100;p.deadUntil=0;p.mx=p.my=p.ax=p.ay=0;p.shoot=false;p.lastShot=0}
function addPlayer(conn){let i=nextNum++,p={id:conn.peer,num:i,color:color(i),conn};spawn(p);players.set(conn.peer,p);conn.send({type:'welcome',num:i,color:p.color});document.getElementById('count').textContent=players.size+' players connected';}
function broadcast(p,msg){try{if(p.conn.open)p.conn.send(msg)}catch(e){}}
if(hostId){
 document.getElementById('arena').style.display='none';document.getElementById('hud').style.display='none';document.getElementById('qrbox').style.display='none';document.getElementById('controller').style.display='flex';
 let conn,ready=false,move={x:0,y:0},aim={x:0,y:0,active:false};
 peer.on('open',()=>{conn=peer.connect(hostId,{reliable:false});conn.on('open',()=>{ready=true;document.getElementById('status').textContent='Connected — waiting for color';});conn.on('data',d=>{if(d.type==='welcome'){document.documentElement.style.setProperty('--player',d.color);document.getElementById('status').textContent='PLAYER '+(d.num+1);document.getElementById('status').style.color=d.color;}if(d.type==='health'){document.getElementById('dead').style.display=d.hp<=0?'block':'none';}});conn.on('close',()=>{ready=false;document.getElementById('status').textContent='Disconnected — reload to reconnect';});conn.on('error',()=>{ready=false;document.getElementById('status').textContent='Connection failed';});});peer.on('error',e=>error(e.message));
 function stick(id,cb){const el=document.getElementById(id),nub=el.querySelector('.nub');let pointer=null;function set(e){const r=el.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2,dx=e.clientX-cx,dy=e.clientY-cy,limit=r.width*.32,len=Math.hypot(dx,dy),scale=len>limit?limit/len:1;dx*=scale;dy*=scale;nub.style.transform=`translate(${dx}px,${dy}px)`;cb(dx/limit,dy/limit,true)}el.addEventListener('pointerdown',e=>{if(pointer!==null)return;pointer=e.pointerId;el.setPointerCapture(pointer);set(e)});el.addEventListener('pointermove',e=>{if(e.pointerId===pointer)set(e)});function stop(e){if(e.pointerId!==pointer)return;pointer=null;nub.style.transform='';cb(0,0,false)}el.addEventListener('pointerup',stop);el.addEventListener('pointercancel',stop);el.addEventListener('lostpointercapture',e=>{if(pointer!==null){pointer=null;nub.style.transform='';cb(0,0,false)}})}
 stick('move',(x,y)=>{move={x,y}});stick('aim',(x,y,active)=>{const l=Math.hypot(x,y);aim={x:l>.12?x/l:0,y:l>.12?y/l:0,active:active&&l>.12}});
 setInterval(()=>{if(ready&&conn&&conn.open)conn.send({type:'input',mx:move.x,my:move.y,ax:aim.x,ay:aim.y,shoot:aim.active})},33);
 return;
}
peer.on('open',id=>{const url=new URL(location.href);url.searchParams.set('join',id);const link=url.toString();document.getElementById('joinurl').textContent='Scan to join';if(typeof QRCode!=='undefined')new QRCode(document.getElementById('qr'),{text:link,width:140,height:140,correctLevel:QRCode.CorrectLevel.M});else error('QR library unavailable. Join URL: '+link);});peer.on('error',e=>error(e.message));
peer.on('connection',conn=>{conn.on('open',()=>addPlayer(conn));conn.on('data',d=>{const p=players.get(conn.peer);if(!p||!d||d.type!=='input')return;const safe=n=>Number.isFinite(n)?Math.max(-1,Math.min(1,n)):0;p.mx=safe(d.mx);p.my=safe(d.my);p.ax=safe(d.ax);p.ay=safe(d.ay);p.shoot=!!d.shoot&&Math.hypot(p.ax,p.ay)>.2;});conn.on('close',()=>{players.delete(conn.peer);document.getElementById('count').textContent=players.size+' players connected'});conn.on('error',()=>{players.delete(conn.peer);document.getElementById('count').textContent=players.size+' players connected'});});
function tick(now){const dt=Math.min((now-last)/1000,.05);last=now;ctx.fillStyle='#10131b';ctx.fillRect(0,0,W,H);ctx.strokeStyle='#1d2531';ctx.lineWidth=1;for(let x=0;x<W;x+=40){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke()}for(let y=0;y<H;y+=40){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke()}
for(const p of players.values()){
 if(p.hp<=0){if(now>=p.deadUntil){spawn(p);broadcast(p,{type:'health',hp:100})}else continue}
 const ml=Math.hypot(p.mx,p.my),speed=190;p.x=Math.max(15,Math.min(W-15,p.x+(ml>1?p.mx/ml:p.mx)*speed*dt));p.y=Math.max(15,Math.min(H-15,p.y+(ml>1?p.my/ml:p.my)*speed*dt));
 if(p.shoot&&now-p.lastShot>=180){const a=Math.atan2(p.ay,p.ax);bullets.push({x:p.x+Math.cos(a)*18,y:p.y+Math.sin(a)*18,vx:Math.cos(a)*390,vy:Math.sin(a)*390,owner:p.id,color:p.color,life:1.8});p.lastShot=now}
 ctx.fillStyle=p.color;ctx.fillRect(p.x-12,p.y-12,24,24);ctx.fillStyle='#303746';ctx.fillRect(p.x-17,p.y+19,34,5);ctx.fillStyle=p.color;ctx.fillRect(p.x-17,p.y+19,34*p.hp/100,5);ctx.fillStyle='#fff';ctx.font='11px system-ui';ctx.textAlign='center';ctx.fillText(String(p.num+1),p.x,p.y-19);
}
for(let i=bullets.length-1;i>=0;i--){const b=bullets[i];b.x+=b.vx*dt;b.y+=b.vy*dt;b.life-=dt;if(b.life<=0||b.x<0||b.x>W||b.y<0||b.y>H){bullets.splice(i,1);continue}let hit=false;for(const p of players.values()){if(p.id===b.owner||p.hp<=0)continue;if(Math.abs(b.x-p.x)<15&&Math.abs(b.y-p.y)<15){p.hp=Math.max(0,p.hp-20);broadcast(p,{type:'health',hp:p.hp});if(!p.hp)p.deadUntil=now+3000;hit=true;break}}if(hit){bullets.splice(i,1);continue}ctx.fillStyle=b.color;ctx.fillRect(b.x-4,b.y-4,8,8)}requestAnimationFrame(tick)}requestAnimationFrame(tick);
})();
</script></body></html>
